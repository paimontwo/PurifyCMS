services:
  purifycms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purifycms
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - purify_data:/var/www/html/inc/data
      # Uncomment below only if you already have a pre-configured inc/config.php:
      # - ./inc/config.php:/var/www/html/inc/config.php:ro
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html

volumes:
  purify_data:
