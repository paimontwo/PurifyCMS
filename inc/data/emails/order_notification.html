<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #334155;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 45px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
        }

        .summary-row {
            margin-top: 30px;
            border-top: 2px solid #f1f5f9;
            padding-top: 20px;
        }

        .btn-track {
            display: inline-block;
            background: #0f172a;
            color: #ffffff;
            padding: 16px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            margin-top: 40px;
        }

        /* Modifiable Variable List:
           {{TITLE}} - Header Title
           {{SUBMSG}} - Sub-header Description
           {{ITEMS_HTML}} - Product rows generated by system
           {{TOTAL}} - Order total (formatted)
           {{CURRENCY}} - Currency (e.g. TRY)
           {{ORDER_ID}} - High-entropy OID
           {{ORDER_DATE}} - Formatted creation date
           {{ORDER_TRACK_URL}} - Link to tracking
           {{SITE_NAME}} - System site name
           {{YEAR}} - Current year
        */
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <!-- Header Section -->
            <div class="header">
                <div
                    style="width: 56px; height: 56px; background: #eff6ff; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 24px;">
                    <span style="color: #2563eb; font-size: 28px; line-height: 56px;">✉</span>
                </div>
                <h2 style="margin: 0; color: #0f172a; letter-spacing: -0.04em; font-size: 26px; font-weight: 800;">
                    {{TITLE}}</h2>
                <p style="color: #64748b; margin-top: 10px; font-size: 16px; font-weight: 500;">{{SUBMSG}}</p>
            </div>

            <!-- Context Info -->
            <div
                style="background: #f8fafc; border-radius: 20px; padding: 24px; margin-bottom: 35px; border: 1px solid #f1f5f9;">
                <table width="100%">
                    <tr>
                        <td>
                            <span
                                style="font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 800; letter-spacing: 0.05em;">Sipariş
                                Numarası</span><br>
                            <strong style="color: #0f172a; font-size: 15px;">#{{ORDER_ID}}</strong>
                        </td>
                        <td style="text-align: right;">
                            <span
                                style="font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 800; letter-spacing: 0.05em;">İşlem
                                Tarihi</span><br>
                            <strong style="color: #0f172a; font-size: 15px;">{{ORDER_DATE}}</strong>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- Items Section -->
            <table class="items-table">
                {{ITEMS_HTML}}
            </table>

            <!-- Summary Section -->
            <div class="summary-row">
                <table width="100%">
                    <tr>
                        <td style="font-weight: 700; color: #64748b; font-size: 16px;">Genel Toplam</td>
                        <td
                            style="text-align: right; font-size: 28px; font-weight: 900; color: #0f172a; letter-spacing: -0.02em;">
                            {{TOTAL}} {{CURRENCY}}</td>
                    </tr>
                </table>
            </div>

            <!-- Call to Action -->
            <div style="text-align: center;">
                <a href="{{ORDER_TRACK_URL}}" class="btn-track">Siparişimi Takip Et</a>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; {{YEAR}} {{SITE_NAME}}<br>
            Bu e-posta işlem güvenliğiniz için otomatik olarak oluşturulmuştur.
        </div>
    </div>
</body>

</html>
